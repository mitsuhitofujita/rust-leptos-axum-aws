[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[workspace.dependencies]
shared = { path = "crates/shared" }

leptos = "0.8.20"
leptos_router = "0.8.15"
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false }

# The action-type icon catalog. Two versions are pinned separately and neither
# implies the other: this crate's, and the Lucide release its geometry comes
# from, which THIRD_PARTY_NOTICES.md names — DR-0014.
lucide-leptos = "3.26.0"

# The browser APIs the sign-in flow reaches for directly. These versions are the
# ones leptos and gloo-net already resolve to, and wasm-bindgen in particular is
# pinned to what is in Cargo.lock: trunk downloads a wasm-bindgen CLI matching
# the version in the dependency graph, so moving it silently changes a tool
# download too — DR-0003.
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
web-sys = "0.3.103"

axum = "0.8.9"
tokio = "1.53.1"

# The forwarding leg of crates/devgateway, and the hyper client underneath it.
# Both are already in Cargo.lock as dependencies of axum, so declaring this adds
# feature flags and no packages. The forwarding leg is plain HTTP to loopback;
# the TLS below is for the one outbound call that is not.
hyper-util = "0.1.20"

# The JWKS fetch in crates/devgateway's `cognito` mode, and the RS256 signature
# check underneath it. Both are already in Cargo.lock beneath aws-sdk-dynamodb —
# hyper-rustls is how the SDK reaches AWS, and aws-lc-rs is rustls 0.23's default
# cryptographic backend — so declaring them adds two dependency edges and no
# packages, and the devcontainer image needs nothing new. DR-0022.
#
# aws-lc-rs's default features include `ring-io` and `ring-sig-verify`, which are
# a compatibility surface for code ported from ring and pull in `untrusted` 0.7
# beside the 0.9 already here. Nothing in devgateway is ported from ring, so they
# are off and the "no new packages" above is literally true. The cost is that
# RsaKeyPair::public_key() loses `modulus_len`; `public_modulus_len()` on the key
# pair itself is the same number.
hyper-rustls = { version = "0.27.9", default-features = false }
aws-lc-rs = { version = "1.18.0", default-features = false, features = [
    "aws-lc-sys",
    "alloc",
] }

# The store. The SDK is the only way to reach DynamoDB, and `aws-config` is what
# resolves credentials and region — in Lambda from the execution environment,
# locally from whatever the developer has.
aws-config = "1.10.1"
aws-sdk-dynamodb = "1.120.0"

# An identifier that sorts by creation time and needs no coordination to mint,
# which is what the sort key encoding asks for — DR-0015.
ulid = "3.0.0"

# One formatted instant. `created_at` and the key it is embedded in have to be
# fixed-width RFC 3339 in UTC or the sort key orders wrongly, and calendar
# arithmetic is not something to hand-roll for a value that fails silently.
time = { version = "0.3.55", features = ["formatting", "macros"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
