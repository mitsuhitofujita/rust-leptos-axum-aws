[build]
target = "index.html"
dist = "dist"

[serve]
# 0.0.0.0 so the devcontainer port forward can reach the dev server.
address = "0.0.0.0"
port = 8080
open = false

# Unknown paths fall back to index.html, which is what makes a reload on
# /dashboard work. The production host (S3 + CloudFront) needs the equivalent.

# Development only: makes the SPA and the API look like one origin, so no CORS
# is involved. Production serves them from separate origins — see DR-0001.
[[proxy]]
backend = "http://127.0.0.1:3000/api"
