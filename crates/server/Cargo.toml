[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shared.workspace = true

axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
ulid.workspace = true
time.workspace = true

# The JWKS fetch in identity::Auth::from_environment, and the RS256 check in
# cognito.rs. hyper-rustls/aws-lc-rs are already in Cargo.lock beneath
# aws-sdk-dynamodb; declaring them here adds dependency edges, not packages.
# aws-lc-rs is declared without default features because ring-io and
# ring-sig-verify are a compatibility surface for code ported from `ring`,
# and nothing here is — DR-0028.
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, features = [
    "http1",
    "rustls-native-certs",
    "aws-lc-rs",
] }
aws-lc-rs.workspace = true

# The key set jwks.rs reads, and the token payload cognito.rs verifies.
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
