[package]
name = "devgateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

# The forwarding leg. hyper's own client rather than a high-level one: the target
# is plain HTTP on loopback, so nothing here wants a TLS stack and the image
# needs no new system packages — DR-0021. The features named here are what pull
# in hyper itself; it is never referred to by name.
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }

# The request context this writes, and the token payload it reads.
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
