[package]
name = "devgateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

# The forwarding leg. hyper's own client rather than a high-level one: the target
# is plain HTTP on loopback, so that leg wants no TLS — DR-0023. The features
# named here are what pull in hyper itself; it is never referred to by name.
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }

# The one outbound call that is not loopback: the JWKS fetch at startup.
# `rustls-native-certs` rather than a bundled root store, so the trust anchors
# are the image's own /etc/ssl/certs — the same ones curl and the AWS CLI use,
# and one fewer thing to keep current. `aws-lc-rs` is named explicitly because
# hyper-rustls is declared without default features; it is rustls 0.23's default
# backend either way, and it is also what verifies the RS256 signature in
# authorizer.rs. DR-0022.
hyper-rustls = { workspace = true, features = [
    "http1",
    "rustls-native-certs",
    "aws-lc-rs",
] }
aws-lc-rs.workspace = true

# The key set this reads, and the token payload it verifies.
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
